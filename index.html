<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Ngân hàng Câu hỏi & Tạo Đề Kiểm Tra Tin Học</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .print-area { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                💻 Quản Lý Ngân Hàng Đề Kiểm Tra Tin Học 9
            </h1>
            <div class="mt-3 md:mt-0 flex gap-2">
                <button onclick="switchTab('bank')" id="btnBank" class="px-4 py-2 bg-indigo-700 rounded-lg font-medium transition hover:bg-indigo-800 shadow">Ngân hàng câu hỏi</button>
                <button onclick="switchTab('exam')" id="btnExam" class="px-4 py-2 bg-indigo-500 rounded-lg font-medium transition hover:bg-indigo-600 shadow">Tạo đề thi ngẫu nhiên</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- TAB 1: NGÂN HÀNG CÂU HỎI & CHỈNH SỬA -->
        <section id="tabBank" class="space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex flex-wrap gap-3 items-center">
                    <select id="filterLesson" onchange="filterQuestions()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Tất cả các bài</option>
                        <option value="1">Bài 1: Thế giới kỹ thuật số</option>
                        <option value="2">Bài 2: Thông tin trong giải quyết vấn đề</option>
                        <option value="3">Bài 3: Đánh giá chất lượng thông tin</option>
                        <option value="4">Bài 4: Pháp luật về sử dụng Internet</option>
                    </select>
                    <select id="filterLevel" onchange="filterQuestions()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="">Tất cả mức độ</option>
                        <option value="Biết">Biết</option>
                        <option value="Hiểu">Hiểu</option>
                    </select>
                    <input type="text" id="searchInput" onkeyup="filterQuestions()" placeholder="Tìm kiếm nội dung câu hỏi..." class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-64">
                </div>
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow flex items-center gap-2">
                    ➕ Thêm câu hỏi mới
                </button>
            </div>

            <!-- Danh sách câu hỏi -->
            <div id="questionsListContainer" class="space-y-4">
                <!-- Được render bằng JavaScript -->
            </div>
        </section>

        <!-- TAB 2: TẠO VÀ XEM ĐỀ THI -->
        <section id="tabExam" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 no-print space-y-4">
                <h2 class="text-lg font-bold text-slate-700">Tùy chỉnh cấu trúc đề kiểm tra</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Tên mã đề / Tiêu đề:</label>
                        <input type="text" id="examTitle" value="KIỂM TRA 15 PHÚT - MÔN TIN HỌC 9" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Mã đề:</label>
                        <input type="text" id="examCode" value="101" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Số lượng câu hỏi:</label>
                        <input type="number" id="examCount" value="20" min="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div class="flex items-end">
                        <button onclick="generateExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow flex items-center justify-center gap-2">
                            🎲 Trộn đề ngẫu nhiên
                        </button>
                    </div>
                </div>
            </div>

            <!-- Khu vực hiển thị đề thi để in hoặc làm -->
            <div id="examPreviewArea" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 print-area space-y-6">
                <div class="text-center space-y-1 border-b pb-4">
                    <h3 id="previewTitle" class="font-bold text-xl uppercase">KIỂM TRA 15 PHÚT - MÔN TIN HỌC 9</h3>
                    <p class="text-sm font-semibold text-slate-600">Mã đề: <span id="previewCode">101</span></p>
                </div>
                <div id="previewQuestionsContainer" class="space-y-4">
                    <p class="text-center text-slate-500 italic py-8">Chưa có đề nào được tạo. Hãy bấm "Trộn đề ngẫu nhiên" ở trên!</p>
                </div>
                
                <!-- Bảng đáp án ẩn/hiện -->
                <div id="answerKeyContainer" class="mt-8 pt-6 border-t border-dashed border-slate-300 hidden">
                    <h4 class="font-bold text-base text-slate-700 mb-2">BẢNG ĐÁP ÁN ĐỀ THI</h4>
                    <div id="answerKeyGrid" class="grid grid-cols-5 md:grid-cols-10 gap-2 text-sm"></div>
                </div>

                <div class="flex justify-end gap-3 pt-4 no-print">
                    <button onclick="toggleAnswerKey()" id="btnToggleKey" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition">Hiện đáp án</button>
                    <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow">🖨️ In đề / Lưu PDF</button>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL THÊM / SỬA CÂU HỎI -->
    <div id="questionModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg">Thêm câu hỏi mới</h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto flex-grow">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Thuộc bài học:</label>
                        <select id="modalLesson" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="1">Bài 1: Thế giới kỹ thuật số</option>
                            <option value="2">Bài 2: Thông tin trong giải quyết vấn đề</option>
                            <option value="3">Bài 3: Đánh giá chất lượng thông tin</option>
                            <option value="4">Bài 4: Pháp luật về sử dụng Internet</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Mức độ:</label>
                        <select id="modalLevel" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Biết">Biết</option>
                            <option value="Hiểu">Hiểu</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nội dung câu hỏi:</label>
                    <textarea id="modalText" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nhập nội dung câu hỏi..."></textarea>
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-medium text-slate-700">Các phương án trả lời:</label>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-slate-500 w-6">A.</span>
                        <input type="text" id="modalOptA" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Đáp án A">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-slate-500 w-6">B.</span>
                        <input type="text" id="modalOptB" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Đáp án B">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-slate-500 w-6">C.</span>
                        <input type="text" id="modalOptC" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Đáp án C">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-slate-500 w-6">D.</span>
                        <input type="text" id="modalOptD" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Đáp án D">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Đáp án đúng:</label>
                    <select id="modalCorrect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="A">Đáp án A</option>
                        <option value="B">Đáp án B</option>
                        <option value="C">Đáp án C</option>
                        <option value="D">Đáp án D</option>
                    </select>
                </div>
            </div>
            <div class="bg-slate-100 px-6 py-3 flex justify-end gap-3 border-t">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm font-medium transition">Hủy</button>
                <button onclick="saveQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow">Lưu câu hỏi</button>
            </div>
        </div>
    </div>

    <!-- Nhúng file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
